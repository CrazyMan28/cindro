# Jarvis — Sway keybind + layer-shell rules snippet.
# Install: copy into ~/.config/sway/config.d/ (or `include` it from your sway config),
# then reload sway (`swaymsg reload`). Requires jarvis-sidebar on $PATH.
#
# wlr-layer-shell anchoring is handled entirely by the app (LayerShellQt sets
# layer=top, anchors=top|right|bottom, exclusive-zone=width, scope="jarvis-sidebar"),
# so no `for_window` geometry rules are needed — sway honors the layer surface.

# $mod+j toggles the sidebar: first press launches it; subsequent presses
# show/hide the running instance via its single-instance IPC (--toggle).
bindsym $mod+j exec jarvis-sidebar --toggle

# Make sure the sidebar always launches under the Wayland platform plugin.
# (Set globally so the bind above inherits it.)
exec_always export QT_QPA_PLATFORM=wayland
