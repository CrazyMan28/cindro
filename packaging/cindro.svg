<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Cindro">
  <title>Cindro</title>
  <defs>
    <!-- Dark disc body -->
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1b2a33"/>
      <stop offset="55%" stop-color="#0f1820"/>
      <stop offset="100%" stop-color="#070c10"/>
    </radialGradient>
    <!-- Cyan glow for the ring -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#19E3FF" stop-opacity="0"/>
      <stop offset="86%" stop-color="#19E3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#19E3FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Center core glow -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafdff"/>
      <stop offset="32%" stop-color="#19E3FF"/>
      <stop offset="100%" stop-color="#0a7d92"/>
    </radialGradient>
    <linearGradient id="cStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9af4ff"/>
      <stop offset="100%" stop-color="#19E3FF"/>
    </linearGradient>
    <!-- Soft outer bloom -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark disc base -->
  <circle cx="128" cy="128" r="120" fill="url(#disc)" stroke="#0a1116" stroke-width="4"/>

  <!-- Outer glow halo of the ring -->
  <circle cx="128" cy="128" r="96" fill="url(#ringGlow)"/>

  <!-- Glowing cyan ring -->
  <g filter="url(#bloom)">
    <circle cx="128" cy="128" r="92" fill="none" stroke="#19E3FF" stroke-width="6" stroke-opacity="0.95"/>
    <!-- Inner thin ring for arc-reactor detail -->
    <circle cx="128" cy="128" r="72" fill="none" stroke="#19E3FF" stroke-width="2.5" stroke-opacity="0.5"/>
  </g>

  <!-- Reactor spokes (subtle, even count for symmetry) -->
  <g stroke="#19E3FF" stroke-width="3" stroke-opacity="0.32" stroke-linecap="round">
    <line x1="128" y1="42"  x2="128" y2="66"/>
    <line x1="128" y1="190" x2="128" y2="214"/>
    <line x1="42"  y1="128" x2="66"  y2="128"/>
    <line x1="190" y1="128" x2="214" y2="128"/>
    <line x1="67"  y1="67"  x2="84"  y2="84"/>
    <line x1="172" y1="172" x2="189" y2="189"/>
    <line x1="189" y1="67"  x2="172" y2="84"/>
    <line x1="84"  y1="172" x2="67"  y2="189"/>
  </g>

  <!-- Glowing core disc -->
  <g filter="url(#bloom)">
    <circle cx="128" cy="128" r="58" fill="#0c161c"/>
    <circle cx="128" cy="128" r="58" fill="none" stroke="url(#core)" stroke-width="3" stroke-opacity="0.7"/>
  </g>

  <!-- 'C' mark, centered on the core -->
  <g filter="url(#bloom)">
    <path d="M 158 140 A 34 34 0 1 1 158 116"
          fill="none"
          stroke="url(#cStroke)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
