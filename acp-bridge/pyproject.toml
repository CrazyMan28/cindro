[project]
name = "cindro-acp"
version = "0.1.0"
description = "cindro-acp: an Agent Client Protocol (ACP) bridge that lets Zed / any ACP editor drive Cindro natively, translating ACP JSON-RPC over stdio to/from the jarvisd Contract A control WebSocket."
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0",
]

[project.scripts]
cindro-acp = "acp_bridge.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acp_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
