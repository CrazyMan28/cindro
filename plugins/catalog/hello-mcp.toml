# Jarvis plugin manifest (signed) — sample to prove the pack/sign/verify flow.
id = "hello-mcp"
name = "Hello MCP"
author = "Jarvis Labs"
version = "1.0.0"
kind = "both"
description = "A tiny signed sample: a stdio MCP server that echoes, plus a skill."
permissions = ["filesystem:/tmp/hello-mcp", "network:api.hello.test"]

signature = "ed25519:45663c69d74bb710:dCY21/ZhvGebuVUqvws4n7MBzdM/BPn2BiZdSRKHlYS5VpoB5fJ7q88s1yR4miojdBHAwDa7ZUJmjXqUY72JDQ=="
[mcp]
transport = "stdio"
command = "hello-mcp --stdio"
env_keys = ["HELLO_TOKEN"]

[skill]
path = "skill/SKILL.md"
