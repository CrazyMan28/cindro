# Cindro plugin manifest (signed) — sample to prove the pack/sign/verify flow.
id = "hello-mcp"
name = "Hello MCP"
author = "Cindro Labs"
version = "1.0.0"
kind = "both"
description = "A tiny signed sample: a stdio MCP server that echoes, plus a skill."
permissions = ["filesystem:/tmp/hello-mcp", "network:api.hello.test"]

signature = "ed25519:7591cf30235f09f7:yHCLe4m+qD3MG0kRbysnoy/z9qKvalaU480IPf44qsUqz0ktUnsS/osvBCkz2rCH8t93aeKDLi/TYYxbXDezDQ=="

[mcp]
transport = "stdio"
command = "hello-mcp --stdio"
env_keys = ["HELLO_TOKEN"]

[skill]
path = "skill/SKILL.md"
