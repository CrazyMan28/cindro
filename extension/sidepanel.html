<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS — Chrome co-worker</title>
  <style>
    :root {
      --bg: #0A0E16;
      --panel: #0E1420;
      --panel-2: #121A28;
      --accent: #29E7FF;
      --accent-bright: #7FF4FF;
      --muted: #8aa;
      --text: #EAF6FF;
      --hairline: rgba(41, 231, 255, 0.18);
      --hairline-soft: rgba(120, 160, 180, 0.14);
      --user-bg: rgba(41, 231, 255, 0.12);
      --user-border: rgba(41, 231, 255, 0.45);
      --bad: #ff5d6c;
      --ok: #36e08a;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ---------------------------------------------------------- header */
    header {
      flex: none;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(180deg, rgba(41,231,255,0.06), transparent);
      border-bottom: 1px solid var(--hairline);
    }
    .brand {
      font-family: var(--mono); font-weight: 700; font-size: 12px;
      letter-spacing: 1.2px; color: var(--accent-bright);
      text-shadow: 0 0 10px rgba(41,231,255,0.35);
      white-space: nowrap;
    }
    .brand .sub { color: var(--muted); font-weight: 500; letter-spacing: 0.4px; }
    .spacer { flex: 1 1 auto; }

    .dot {
      width: 9px; height: 9px; border-radius: 50%; flex: none;
      background: var(--bad); box-shadow: 0 0 7px var(--bad);
      transition: background 200ms, box-shadow 200ms;
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

    select.brain {
      font-family: var(--mono); font-size: 11px;
      background: var(--panel-2); color: var(--accent-bright);
      border: 1px solid var(--hairline); border-radius: 6px;
      padding: 3px 6px; cursor: pointer; outline: none;
    }
    .hdrbtn {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      background: var(--panel-2); color: var(--accent-bright);
      border: 1px solid var(--hairline); border-radius: 6px;
      padding: 3px 8px; cursor: pointer; outline: none; white-space: nowrap;
      transition: background 150ms, transform 120ms;
    }
    .hdrbtn:hover { background: rgba(41,231,255,0.12); }
    .hdrbtn:active { transform: scale(0.94); }

    /* --------------------------------------------------- session picker */
    .sessions {
      flex: none; max-height: 46vh; overflow-y: auto;
      background: var(--panel); border-bottom: 1px solid var(--hairline);
      scrollbar-width: thin; scrollbar-color: var(--hairline) transparent;
    }
    .sessions::-webkit-scrollbar { width: 8px; }
    .sessions::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }
    .sessions-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; position: sticky; top: 0;
      background: var(--panel); border-bottom: 1px solid var(--hairline-soft);
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px;
      color: var(--accent-bright);
    }
    .sessions-head span { flex: 1 1 auto; }
    .sess-item {
      display: flex; align-items: baseline; gap: 8px;
      padding: 8px 12px; cursor: pointer;
      border-bottom: 1px solid var(--hairline-soft);
      transition: background 120ms;
    }
    .sess-item:hover { background: rgba(41,231,255,0.08); }
    .sess-item.current { background: rgba(41,231,255,0.12); }
    .sess-title {
      flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600;
      color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sess-meta {
      flex: none; font-family: var(--mono); font-size: 10px; color: var(--muted);
      white-space: nowrap;
    }
    .sess-empty { padding: 12px; color: var(--muted); font-size: 12px; text-align: center; }
    .chip {
      font-family: var(--mono); font-size: 10.5px;
      color: var(--muted); background: var(--panel-2);
      border: 1px solid var(--hairline-soft); border-radius: 999px;
      padding: 3px 8px; white-space: nowrap;
    }

    /* ----------------------------------------------------- tab context */
    .tabctx {
      flex: none;
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--hairline-soft);
    }
    .tabctx .meta { min-width: 0; flex: 1 1 auto; }
    .tabctx .t-title {
      font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tabctx .t-url {
      font-family: var(--mono); font-size: 10.5px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .iconbtn {
      flex: none; cursor: pointer; user-select: none;
      width: 26px; height: 26px; border-radius: 6px;
      display: grid; place-items: center;
      background: var(--panel-2); color: var(--accent);
      border: 1px solid var(--hairline); font-size: 13px;
      transition: background 150ms, transform 150ms;
    }
    .iconbtn:hover { background: rgba(41,231,255,0.12); }
    .iconbtn:active { transform: scale(0.92); }

    /* ------------------------------------------------------- transcript */
    #transcript {
      flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
      padding: 12px 10px 4px; display: flex; flex-direction: column; gap: 9px;
      scrollbar-width: thin; scrollbar-color: var(--hairline) transparent;
    }
    #transcript::-webkit-scrollbar { width: 8px; }
    #transcript::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .row.jarvis { justify-content: flex-start; }

    .bubble {
      max-width: 86%;
      padding: 8px 11px; border-radius: 12px;
      line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .bubble.user {
      background: var(--user-bg); border: 1px solid var(--user-border);
      border-bottom-right-radius: 4px; color: var(--text);
    }
    .bubble.jarvis {
      background: var(--panel-2); border: 1px solid var(--hairline-soft);
      border-bottom-left-radius: 4px; color: var(--text);
    }

    .thinking {
      max-width: 90%; font-style: italic; color: var(--muted);
      font-size: 12px; line-height: 1.4; padding: 2px 4px;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    }
    .tool {
      max-width: 92%; font-family: var(--mono); font-size: 11.5px; font-weight: 600;
      color: var(--accent-bright); padding: 4px 10px;
      background: rgba(41,231,255,0.10); border: 1px solid var(--hairline);
      border-left: 3px solid var(--accent); border-radius: 7px;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
      box-shadow: 0 0 8px rgba(41,231,255,0.08);
    }
    .tool.bad { border-left-color: var(--bad); }
    .errmsg {
      max-width: 90%; color: var(--bad); font-size: 12px;
      padding: 6px 10px; background: rgba(255,93,108,0.08);
      border: 1px solid rgba(255,93,108,0.35); border-radius: 8px;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    }
    .sys {
      align-self: center; color: var(--muted); font-size: 11px;
      font-family: var(--mono); text-align: center; padding: 2px 8px;
      opacity: 0.85;
    }

    .caret::after {
      content: "▍"; color: var(--accent); margin-left: 1px;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ----------------------------------------- whimsical "working" bar */
    .working {
      flex: none; display: flex; align-items: center; gap: 9px;
      padding: 7px 12px; border-top: 1px solid var(--hairline);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px; letter-spacing: 0.6px; color: var(--accent);
      background: linear-gradient(0deg, rgba(41,231,255,0.05), transparent);
    }
    .working.hidden { display: none; }
    .working .spin {
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid rgba(41,231,255,0.25);
      border-top-color: var(--accent-bright);
      animation: spin 0.8s linear infinite;
    }
    .working .dots { animation: blink 1.2s step-start infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --------------------------------------------------------- composer */
    .composer {
      flex: none; display: flex; gap: 8px; align-items: flex-end;
      padding: 10px 10px 12px;
      border-top: 1px solid var(--hairline);
      background: linear-gradient(0deg, rgba(41,231,255,0.04), transparent);
    }
    #input {
      flex: 1 1 auto; resize: none; max-height: 120px; min-height: 38px;
      font-family: var(--sans); font-size: 13px; line-height: 1.4;
      color: var(--text); background: var(--panel-2);
      border: 1px solid var(--hairline); border-radius: 10px;
      padding: 9px 11px; outline: none;
    }
    #input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(41,231,255,0.12); }
    #input::placeholder { color: var(--muted); }
    #input:disabled { opacity: 0.55; }

    .sendbtn, .stopbtn {
      flex: none; cursor: pointer; user-select: none; font-weight: 700;
      height: 38px; padding: 0 16px; border-radius: 10px; font-size: 13px;
      border: 1px solid var(--accent); transition: background 150ms, transform 120ms;
    }
    .sendbtn {
      background: var(--accent); color: #04121a;
      box-shadow: 0 0 14px rgba(41,231,255,0.35);
    }
    .sendbtn:hover { background: var(--accent-bright); }
    .sendbtn:active { transform: scale(0.96); }
    .sendbtn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
    .stopbtn {
      background: rgba(255,93,108,0.12); color: var(--bad);
      border-color: rgba(255,93,108,0.55);
    }
    .stopbtn:hover { background: rgba(255,93,108,0.2); }

    /* ----------------------------------------------------- quick flow + "/" palette */
    .quickbar {
      flex: none; display: flex; gap: 6px; padding: 6px 10px 0;
      overflow-x: auto;
    }
    .quickbar .chip { cursor: pointer; transition: color 150ms, border-color 150ms, background 150ms; }
    .quickbar .chip:hover { color: var(--accent-bright); border-color: var(--accent); background: rgba(41,231,255,0.08); }

    .slash-palette {
      flex: none; margin: 0 10px 6px; max-height: 260px; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--accent);
      border-radius: 12px; box-shadow: 0 -8px 22px rgba(0,0,0,0.45);
      animation: slashIn 160ms ease-out;
    }
    @keyframes slashIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .slash-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      cursor: pointer; border-radius: 9px;
    }
    .slash-row:hover, .slash-row.sel { background: rgba(41,231,255,0.10); }
    .slash-ic {
      flex: none; width: 26px; height: 26px; border-radius: 8px;
      display: grid; place-items: center; font-size: 13px;
      background: var(--panel-2); color: var(--accent);
    }
    .slash-ic.agent { color: #B28BFF; background: rgba(178,139,255,0.16); }
    .slash-ic.skill { color: #5B8CFF; background: rgba(91,140,255,0.16); }
    .slash-main { min-width: 0; flex: 1 1 auto; }
    .slash-label { font-family: var(--mono); font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slash-sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slash-grp { flex: none; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--muted); }

    .hidden { display: none !important; }

    /* ================================================= phone panel */
    .phone-panel {
      flex: 1 1 auto; display: flex; flex-direction: column;
      overflow: hidden; background: var(--panel);
    }

    /* active / incoming call banner with pulsing ring */
    .phone-banner {
      flex: none; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: rgba(41,231,255,0.07);
      border-bottom: 2px solid var(--accent);
    }
    .phone-banner-ring {
      flex: none; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(41,231,255,0.12); border: 2px solid var(--accent);
      display: grid; place-items: center; font-size: 17px;
      animation: ringPulse 1.3s ease-in-out infinite;
    }
    @keyframes ringPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(41,231,255,0.55); }
      50%      { box-shadow: 0 0 0 9px rgba(41,231,255,0); }
    }
    .phone-banner-info { flex: 1 1 auto; min-width: 0; }
    .phone-banner-label { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent-bright); }
    .phone-banner-meta  { font-size: 10.5px; color: var(--muted); }
    .phone-banner-actions { flex: none; display: flex; gap: 6px; }

    /* tab bar */
    .phone-tabs {
      flex: none; display: flex; align-items: center; gap: 2px;
      padding: 6px 8px; border-bottom: 1px solid var(--hairline);
      background: var(--panel-2);
    }
    .phone-tab {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      background: transparent; color: var(--muted);
      border: 1px solid transparent; border-radius: 7px;
      padding: 4px 10px; cursor: pointer; outline: none;
      transition: color 150ms, background 150ms, border-color 150ms;
      white-space: nowrap;
    }
    .phone-tab.active {
      color: var(--accent-bright); background: rgba(41,231,255,0.10);
      border-color: var(--hairline);
    }
    .phone-tab:hover:not(.active) { color: var(--text); }

    /* scrollable tab view */
    .phone-view {
      flex: 1 1 auto; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--hairline) transparent;
    }
    .phone-view::-webkit-scrollbar { width: 6px; }
    .phone-view::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }

    /* section headings */
    .phone-section-head {
      padding: 8px 12px 4px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.2px;
      color: var(--accent); text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
      border-top: 1px solid var(--hairline-soft);
    }
    .phone-section-head:first-child { border-top: none; }

    /* card list */
    .phone-list { display: flex; flex-direction: column; }
    .phone-card {
      padding: 8px 12px; border-bottom: 1px solid var(--hairline-soft);
      display: flex; flex-direction: column; gap: 2px;
      transition: background 120ms;
    }
    .phone-card:hover { background: rgba(41,231,255,0.05); }
    .phone-card-title {
      font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .phone-card-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .phone-card-badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 10px; font-family: var(--mono);
      background: rgba(41,231,255,0.12); color: var(--accent);
    }
    .phone-card-badge.bad { background: rgba(255,93,108,0.12); color: var(--bad); }
    .phone-card-badge.ok  { background: rgba(54,224,138,0.12);  color: var(--ok); }

    /* form area */
    .phone-dialer { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .phone-field-row { display: flex; flex-direction: column; gap: 3px; }
    .phone-field-row label {
      font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.4px;
    }
    .phone-input {
      font-family: var(--mono); font-size: 12px; color: var(--text);
      background: var(--panel-2); border: 1px solid var(--hairline);
      border-radius: 7px; padding: 6px 8px; outline: none;
      resize: none; width: 100%;
    }
    .phone-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(41,231,255,0.10); }
    .phone-select {
      font-family: var(--mono); font-size: 11px; color: var(--accent-bright);
      background: var(--panel-2); border: 1px solid var(--hairline);
      border-radius: 7px; padding: 5px 7px; outline: none; cursor: pointer; width: 100%;
    }

    /* action buttons */
    .phone-btn {
      font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
      border-radius: 8px; padding: 7px 16px; cursor: pointer; outline: none;
      border: 1px solid var(--accent); background: var(--accent); color: #04121a;
      transition: background 150ms, transform 120ms;
      box-shadow: 0 0 10px rgba(41,231,255,0.25);
    }
    .phone-btn:hover   { background: var(--accent-bright); }
    .phone-btn:active  { transform: scale(0.96); }
    .phone-btn:disabled { opacity: 0.45; cursor: default; }
    .phone-btn.bad {
      background: rgba(255,93,108,0.12); color: var(--bad);
      border-color: rgba(255,93,108,0.55); box-shadow: none;
    }
    .phone-btn.bad:hover { background: rgba(255,93,108,0.22); }
    .phone-btn.ok {
      background: rgba(54,224,138,0.14); color: var(--ok);
      border-color: rgba(54,224,138,0.5); box-shadow: none;
    }
    .phone-btn.ok:hover { background: rgba(54,224,138,0.24); }
    .phone-sm-btn {
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      border-radius: 6px; padding: 3px 8px; cursor: pointer; outline: none;
      border: 1px solid var(--hairline); background: var(--panel-2); color: var(--accent);
      transition: background 150ms; white-space: nowrap;
    }
    .phone-sm-btn:hover { background: rgba(41,231,255,0.12); }
    .phone-sm-btn.ok  { color: var(--ok);  border-color: rgba(54,224,138,0.4); }
    .phone-sm-btn.bad { color: var(--bad); border-color: rgba(255,93,108,0.4); }

    /* result text */
    .phone-result {
      font-family: var(--mono); font-size: 11px; line-height: 1.5;
      color: var(--muted); padding: 4px 0;
      white-space: pre-wrap; word-wrap: break-word; min-height: 0;
    }
    .phone-result.ok  { color: var(--ok); }
    .phone-result.bad { color: var(--bad); }

    /* status readout */
    .phone-status-box {
      margin: 4px 12px 8px; padding: 10px;
      background: var(--panel-2); border: 1px solid var(--hairline);
      border-radius: 10px; font-family: var(--mono); font-size: 11px;
      line-height: 1.7; color: var(--text); white-space: pre-wrap;
    }

    /* inline badge */
    .phone-badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-family: var(--mono); font-size: 10px;
      background: rgba(41,231,255,0.12); color: var(--accent);
    }
    .phone-badge.ok  { background: rgba(54,224,138,0.12); color: var(--ok); }
    .phone-badge.bad { background: rgba(255,93,108,0.12); color: var(--bad); }

    /* transcript / thread view */
    .phone-transcript {
      padding: 8px 12px 14px; font-family: var(--mono); font-size: 11px;
      line-height: 1.6; color: var(--text);
      white-space: pre-wrap; word-wrap: break-word;
    }
    /* slide-in animation for the phone panel */
    @keyframes phoneSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .phone-panel:not(.hidden) { animation: phoneSlideIn 180ms ease-out; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot" title="daemon connection"></span>
    <span class="brand">JARVIS <span class="sub">— Chrome co-worker</span></span>
    <span class="spacer"></span>
    <button class="hdrbtn" id="sessionsBtn" title="continue an existing conversation (desktop / phone / here)">☰ Sessions</button>
    <button class="hdrbtn" id="newBtn" title="start a fresh conversation">+ New</button>
    <select class="brain" id="brain" title="brain">
      <option value="codex">codex</option>
      <option value="claude">claude</option>
    </select>
    <select class="brain" id="model" title="model">
      <option value="">default model</option>
    </select>
    <span class="chip" id="tabchip">tabs: —</span>
  </header>

  <!-- Session picker drawer: filled by session.list; pick one to continue it. -->
  <div class="sessions hidden" id="sessionsPanel">
    <div class="sessions-head">
      <span id="sessionsLabel">Conversations</span>
      <div class="iconbtn" id="sessionsClose" title="close">✕</div>
    </div>
    <div id="sessionsList"></div>
  </div>

  <div class="tabctx">
    <div class="meta">
      <div class="t-title" id="ctxTitle">active tab —</div>
      <div class="t-url" id="ctxUrl"></div>
    </div>
    <div class="iconbtn" id="refreshBtn" title="refresh tab context">⟳</div>
  </div>

  <!-- Phone panel — overlays transcript while open, toggled by ☎ Phone chip -->
  <div id="phonePanel" class="phone-panel hidden">

    <!-- Incoming / active call banner with pulsing ring -->
    <div id="phoneBanner" class="phone-banner hidden">
      <div class="phone-banner-ring">☎</div>
      <div class="phone-banner-info">
        <div class="phone-banner-label" id="phoneBannerLabel">Incoming call…</div>
        <div class="phone-banner-meta"  id="phoneBannerMeta"></div>
      </div>
      <div class="phone-banner-actions">
        <button class="phone-btn ok"  id="phoneBannerAccept">Accept</button>
        <button class="phone-btn bad" id="phoneBannerEnd">End</button>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="phone-tabs">
      <button class="phone-tab active" data-ptab="calls">☎ Calls</button>
      <button class="phone-tab"        data-ptab="inbox">✉ Inbox</button>
      <button class="phone-tab"        data-ptab="settings">⚙ Settings</button>
      <span class="spacer"></span>
      <div class="iconbtn" id="phoneClose" title="close phone panel">✕</div>
    </div>

    <!-- ===== CALLS TAB ===== -->
    <div class="phone-view" id="phoneViewCalls">
      <div class="phone-section-head">
        Active Calls
        <button class="phone-sm-btn" id="phoneRefreshCalls">↻</button>
      </div>
      <div id="phoneCallsList" class="phone-list"></div>

      <div id="phoneTranscriptWrap" class="hidden">
        <div class="phone-section-head">
          Call Transcript
          <button class="phone-sm-btn" id="phoneTranscriptBack">✕ Close</button>
        </div>
        <div id="phoneTranscriptBody" class="phone-transcript">Loading…</div>
      </div>

      <div class="phone-section-head">Dialer</div>
      <div class="phone-dialer">
        <div class="phone-field-row">
          <label>Mode</label>
          <select id="phoneDialMode" class="phone-select">
            <option value="inapp">In-App (call_user_and_wait)</option>
            <option value="twilio">PSTN / Twilio (twilio_call_and_wait)</option>
          </select>
        </div>
        <div class="phone-field-row" id="phoneToNumberRow" style="display:none">
          <label>To Number (Twilio only)</label>
          <input id="phoneToNumber" class="phone-input" placeholder="+15555550100">
        </div>
        <div class="phone-field-row">
          <label>Reason</label>
          <input id="phoneDialReason" class="phone-input" placeholder="Why calling?">
        </div>
        <div class="phone-field-row">
          <label>Say</label>
          <textarea id="phoneDialSay" class="phone-input" rows="2" placeholder="What to say on the call…"></textarea>
        </div>
        <button class="phone-btn" id="phoneDialBtn">☎ Call</button>
        <div id="phoneDialResult" class="phone-result"></div>
      </div>
    </div>

    <!-- ===== INBOX TAB ===== -->
    <div class="phone-view hidden" id="phoneViewInbox">
      <div class="phone-section-head">
        Messages
        <button class="phone-sm-btn" id="phoneRefreshInbox">↻</button>
      </div>
      <div id="phoneInboxList" class="phone-list"></div>

      <div id="phoneThreadWrap" class="hidden">
        <div class="phone-section-head">
          Thread
          <button class="phone-sm-btn" id="phoneThreadBack">✕ Close</button>
        </div>
        <div id="phoneThreadBody" class="phone-transcript"></div>
      </div>

      <div class="phone-section-head">Compose</div>
      <div class="phone-dialer">
        <div class="phone-field-row">
          <label>Title / Subject</label>
          <input id="phoneComposeTitle" class="phone-input" placeholder="Subject">
        </div>
        <div class="phone-field-row">
          <label>Body</label>
          <textarea id="phoneComposeBody" class="phone-input" rows="3" placeholder="Message body…"></textarea>
        </div>
        <div class="phone-field-row" style="flex-direction:row;align-items:center;gap:8px">
          <input type="checkbox" id="phoneComposeWait" style="accent-color:var(--accent);cursor:pointer">
          <label for="phoneComposeWait" style="cursor:pointer;margin:0;font-family:var(--mono);font-size:10px;color:var(--muted)">
            Wait for reply (notify_user_and_wait)
          </label>
        </div>
        <button class="phone-btn" id="phoneComposeBtn">✉ Send</button>
        <div id="phoneComposeResult" class="phone-result"></div>
      </div>
    </div>

    <!-- ===== SETTINGS TAB ===== -->
    <div class="phone-view hidden" id="phoneViewSettings">
      <div class="phone-section-head">
        Twilio Status
        <button class="phone-sm-btn" id="phoneRefreshStatus">↻</button>
      </div>
      <div id="phoneTwilioStatus" class="phone-status-box">—</div>

      <div class="phone-section-head">Call Screening</div>
      <div class="phone-dialer">
        <div class="phone-field-row" style="flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap">
          <span id="phoneScreeningBadge" class="phone-badge">—</span>
          <button class="phone-sm-btn ok"  id="phoneScreeningOn">Enable</button>
          <button class="phone-sm-btn bad" id="phoneScreeningOff">Disable</button>
        </div>
      </div>

      <div class="phone-section-head">
        Allowlist
        <button class="phone-sm-btn" id="phoneRefreshAllowlist">↻</button>
      </div>
      <div id="phoneAllowlist" class="phone-list"></div>
      <div class="phone-dialer" style="padding-top:4px">
        <div class="phone-field-row">
          <label>Phone number (E.164)</label>
          <input id="phoneAllowlistNum" class="phone-input" placeholder="+15555550100">
        </div>
        <div class="phone-field-row">
          <label>Label (optional)</label>
          <input id="phoneAllowlistLabel" class="phone-input" placeholder="Home, Mom, …">
        </div>
        <div style="display:flex;gap:6px">
          <button class="phone-sm-btn ok"  id="phoneAllowlistAdd">+ Add</button>
          <button class="phone-sm-btn bad" id="phoneAllowlistRemove">− Remove</button>
        </div>
        <div id="phoneAllowlistResult" class="phone-result"></div>
      </div>

      <div class="phone-section-head">User Number</div>
      <div class="phone-dialer">
        <div class="phone-field-row">
          <input id="phoneUserNumber" class="phone-input" placeholder="+15555550100">
        </div>
        <button class="phone-sm-btn ok" id="phoneSetUserNum">Set Number</button>
        <div id="phoneUserNumResult" class="phone-result"></div>
      </div>

      <div class="phone-section-head">Voice Profile</div>
      <div class="phone-dialer">
        <div class="phone-field-row">
          <label>Extension</label>
          <input id="phoneVoiceExt" class="phone-input" value="101" placeholder="101">
        </div>
        <div class="phone-field-row">
          <label>Voice ID</label>
          <input id="phoneVoiceId" class="phone-input" placeholder="UUID or local:jarvis">
        </div>
        <div class="phone-field-row">
          <label>Speed (0.5 – 2.0)</label>
          <input id="phoneVoiceSpeed" class="phone-input" type="number" min="0.5" max="2" step="0.1" placeholder="1.0">
        </div>
        <div style="display:flex;gap:6px">
          <button class="phone-sm-btn ok" id="phoneVoiceSet">Set</button>
          <button class="phone-sm-btn"    id="phoneVoiceGet">Get</button>
        </div>
        <div id="phoneVoiceResult" class="phone-result"></div>
      </div>

      <div class="phone-section-head" style="color:var(--bad)">War Room</div>
      <div class="phone-dialer">
        <div class="phone-field-row">
          <textarea id="phoneAlertMsg" class="phone-input" rows="2" placeholder="Red alert message…"></textarea>
        </div>
        <button class="phone-btn bad" id="phoneRedAlert">🚨 RED ALERT</button>
        <div id="phoneAlertResult" class="phone-result"></div>
      </div>
    </div>

  </div><!-- /phonePanel -->

  <div id="transcript"></div>

  <div class="working hidden" id="working">
    <span class="spin"></span><span id="workTxt">Thinking</span><span class="dots">…</span>
  </div>

  <!-- "/" command palette: commands + agents + skills, filterable, animated -->
  <div id="slashPalette" class="slash-palette hidden"></div>

  <!-- quick-access flow chips (parity with desktop/phone) -->
  <div class="quickbar" id="quickbar">
    <button class="chip" data-cmd="phone">☎ Phone</button>
    <button class="chip" data-cmd="/agents">✦ Agents</button>
    <button class="chip" data-cmd="/skills">⚡ Skills</button>
    <button class="chip" data-cmd="/running">◴ Running</button>
    <button class="chip" data-cmd="slash">/ Commands</button>
  </div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask Jarvis — or type / for commands…"></textarea>
    <button class="sendbtn" id="sendBtn">Send</button>
    <button class="stopbtn hidden" id="stopBtn">Stop</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
