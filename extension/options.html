<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Computer Use Bridge — Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 460px; margin: 2rem auto; color: #ddd; background: #1b1e23; }
    h1 { font-size: 1.1rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #444; background: #11141a; color: #eee; box-sizing: border-box; }
    button { margin-top: 1.25rem; padding: 0.5rem 1.25rem; border-radius: 6px; border: 0; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
    #status { margin-top: 1rem; padding: 0.5rem 0.75rem; border-radius: 6px; background: #11141a; }
    .ok { color: #4ade80; } .bad { color: #f87171; }
    code { background: #11141a; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Computer Use Bridge</h1>
  <p>Connects to the local computer-use MCP server. The token is in
     <code>~/.computer-use/config.yaml</code> on this machine.</p>
  <label for="port">Server port</label>
  <input id="port" type="number" value="8794">
  <label for="token">Bearer token</label>
  <input id="token" type="password" placeholder="paste bearer_token here">
  <button id="save">Save &amp; Connect</button>
  <div id="status">…</div>
  <script src="options.js"></script>
</body>
</html>
