[project]
name = "jarvis-mcp"
version = "0.1.0"
description = "Jarvis-MCP: one MCP endpoint exposing Jarvis orchestration (Contract A) plus the re-exported computer-use engine, so external agents can drive Jarvis."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.scripts]
jarvis-mcp = "jarvis_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
