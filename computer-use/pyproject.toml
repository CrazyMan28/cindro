[project]
name = "computer-use-mcp"
version = "0.1.0"
description = "Computer-use MCP server: desktop UI control on KDE/Sway Wayland plus a Chrome extension bridge."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "dbus-fast>=2.24",
    "evdev>=1.7",
    # Wayland client used ONLY for agent-mode keyboard: the nested headless sway
    # runs with WLR_LIBINPUT_NO_DEVICES=1, so host uinput/ydotool keystrokes
    # never reach it. We inject keys via zwp_virtual_keyboard_v1 bound to the
    # nested WAYLAND_DISPLAY instead (computer_use_mcp/vkbd.py).
    "pywayland>=0.4.17",
    # Video understanding (computer_use_mcp/video): yt-dlp is imported as a
    # library (never shelled out — it freezes into the Windows exe), and
    # faster-whisper is the default local transcription engine (models
    # auto-download via huggingface-hub). Windows installs this package with
    # --no-deps, so these MUST be mirrored in windows/engine/requirements-windows.txt.
    "yt-dlp>=2026.1",
    "faster-whisper>=1.2",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Cloud transcription backends for video understanding (opt-in; the default
# local backend needs neither). GEMINI_API_KEY / OPENAI_API_KEY select them.
cloud-video = [
    "google-genai>=1.0",
    "openai>=1.60",
]

[project.scripts]
computer-use-mcp = "computer_use_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["computer_use_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
