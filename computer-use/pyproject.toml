[project]
name = "computer-use-mcp"
version = "0.1.0"
description = "Computer-use MCP server: desktop UI control on KDE/Sway Wayland plus a Chrome extension bridge."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "dbus-fast>=2.24",
    "evdev>=1.7",
]

[project.scripts]
computer-use-mcp = "computer_use_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["computer_use_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
