# Builds the Android app: assembleDebug + unit tests on every PR into main,
# and attaches a debug-signed APK to the GitHub Release on a version tag —
# same shape as windows-build.yml / linux-release.yml (PR validation + tag
# release-attach in one workflow). Runs on the self-hosted Proxmox Linux fleet
# (`pve-ubuntu-runner-*`, same as linux-ci.yml/linux-release.yml) — moved off
# GitHub-hosted ubuntu-latest once GitHub-hosted minutes ran out; the Android
# SDK isn't baked into the fleet's image, so android-actions/setup-android
# provisions cmdline-tools + the platform/build-tools this build needs on
# every run (JDK/Gradle already work fine self-hosted via their own actions).
#
# NOTE: no release signing config exists yet in android/app/build.gradle.kts
# (no signingConfigs block) — the attached APK is debug-signed (installable via
# `adb install` / sideloading, but not eligible for Play Store distribution).
# Add a keystore secret + signingConfigs.release block to switch this to
# assembleRelease when real distribution signing is set up.
name: android-build

on:
  # Same two triggers as windows-build.yml / linux-release.yml: a pull_request
  # into main validates the change before merge; a v* tag (created by
  # auto-release.yml on merge to main) builds the release artifact and attaches
  # it to the GitHub Release. Day-to-day pushes to dev/qa/main trigger nothing.
  pull_request:
    branches: [main]
    # Codex review (PR #130): a PR that only touches website-ci.yml (the
    # website's own CI config) belongs solely to the non-versioned site, but
    # wasn't covered by website/** — it still ran this product build. Ignore
    # that workflow file too.
    paths-ignore: ['website/**', '.github/workflows/website-ci.yml']
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed so the tag build can attach the APK to the Release.
permissions:
  contents: write

# A v* tag build (release) is never auto-cancelled — keyed by unique SHA so no
# two tags ever share a group. PR re-pushes dedup: a newer commit on the PR
# supersedes that PR's still-running build.
concurrency:
  group: android-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: [self-hosted, Linux, X64]

    steps:
      # This runner's _work dir is shared with linux-ci.yml/linux-release.yml, which run inside
      # a Docker container (as root) — files that container writes land root-owned on the host,
      # which the unprivileged runner user then can't unlink, and actions/checkout@v4 fails
      # outright instead of falling back to a fresh clone. Force-clear it first every run.
      - name: Clear any root-owned files left by a container-based job on this runner
        run: sudo rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu-latest images ship the Android SDK preinstalled;
      # the self-hosted fleet's image (infra/ci-image/Dockerfile) is scoped to
      # the C++/Qt6 product build and has none of it, so provision it here.
      # Caches cmdline-tools/platform/build-tools across runs by API level.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719

      # Gradle wrapper + dependency caching: on this SELF-HOSTED fleet ~/.gradle
      # already persists on the runner VM's disk, so the action's GitHub-hosted
      # remote cache is pure overhead (multi-hundred-MB restore/save round-trips
      # over the WAN every run) — disable it and rely on the local caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
          cache-disabled: true

      # android/app/build.gradle.kts references libs/sherpa-onnx-1.13.2.aar
      # (on-device TTS) as a local file dependency, but the ~56MB AAR is
      # deliberately gitignored (android/app/libs/*.aar) — every dev machine
      # re-fetches it locally, and CI must do the same or assembleDebug fails
      # at the very first build with "file not found". The runner VM's disk is
      # PERSISTENT, so cache it in ~/ci-cache (shared by every runner instance
      # on the VM) — restoring it through actions/cache@v4's remote cache
      # service was measured at ~1m40s per run for this one 56MB file.
      - name: Fetch sherpa-onnx AAR (persistent local cache)
        run: |
          mkdir -p android/app/libs "$HOME/ci-cache"
          if [ ! -s "$HOME/ci-cache/sherpa-onnx-1.13.2.aar" ]; then
            curl -fsSL -o "$HOME/ci-cache/sherpa-onnx-1.13.2.aar" \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-1.13.2.aar
          fi
          cp "$HOME/ci-cache/sherpa-onnx-1.13.2.aar" android/app/libs/

      - name: Derive version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK + run unit tests
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Cindro-${{ steps.ver.outputs.version }}-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # On a version tag, attach the APK to the Release (same pattern as
      # windows-build.yml's Cindro-Setup.exe / linux-release.yml's AppImage).
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/debug/*.apk "release-out/Cindro-${{ steps.ver.outputs.version }}.apk"

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.apk
