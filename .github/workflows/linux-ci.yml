# Linux regression gate: build the UNTOUCHED root project (core + jarvisd +
# jarvis-sidebar with LayerShellQt), run its ctest suite offscreen, and run the
# computer-use engine's pytest suite. This is what proves the Windows work left the
# Linux/Sway+KDE build byte-for-byte green.
name: linux-ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Qt6 + libsodium + qrencode + ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config extra-cmake-modules \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-multimedia-dev qt6-websockets-dev qt6-wayland qt6-wayland-dev \
            libqrencode-dev libsodium-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-shapes qml6-module-qtquick-effects \
            qml6-module-qtqml-workerscript qml6-module-qtmultimedia \
            qml6-module-qt-labs-platform qml6-module-qt5compat-graphicaleffects || true
          # Re-run without `|| true` masking a hard failure on the core set.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-websockets-dev \
            libqrencode-dev libsodium-dev

      # LayerShellQt (Qt6) provides the `LayerShellQt` CMake package the desktop
      # target REQUIREs. Prefer a distro package; otherwise build it from source.
      - name: Provide LayerShellQt
        run: |
          PKG=$(apt-cache search layershell 2>/dev/null | awk '{print $1}' | grep -- '-dev' | head -1 || true)
          if [ -n "$PKG" ]; then
            echo "Installing distro package: $PKG"
            sudo apt-get install -y --no-install-recommends "$PKG"
          else
            echo "No distro LayerShellQt; building from source (KDE)."
            sudo apt-get install -y --no-install-recommends git qt6-wayland-dev qt6-declarative-dev
            git clone --depth 1 https://invent.kde.org/plasma/layer-shell-qt.git
            cmake -S layer-shell-qt -B layer-shell-qt/build -G Ninja \
              -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
            cmake --build layer-shell-qt/build
            sudo cmake --install layer-shell-qt/build
          fi

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (ctest, offscreen)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine pytest (regression gate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./computer-use
          python -m pytest computer-use/tests -q
