# Linux regression gate: build the UNTOUCHED root project (core + jarvisd +
# cindro-sidebar with LayerShellQt), run its ctest suite offscreen, and run the
# computer-use engine's pytest suite. Proves the Windows work left the Linux build green.
#
# Runs in a PREBUILT image (Qt 6.11 + layer-shell-qt 6.7, like the dev box —
# Ubuntu 24.04's apt Qt 6.4.2 is too old). All build deps are baked into the image
# (infra/ci-image/Dockerfile), hosted in the runner's local registry. So a run does
# NO per-build package download AND no per-build install/extract — the container
# starts with everything already present. Rebuild the image only when deps change:
#   infra/ci-image/build.sh   (build -> push to localhost:5000/jarvis-ci:latest)
name: linux-ci

on:
  # Test gate: runs ONLY to validate a pull_request into main — never on a branch push.
  # Day-to-day work on dev / qa / main triggers no test run here.
  pull_request:
    branches: [main]
    # Codex review (PR #130): a PR that only touches website-ci.yml (the
    # website's own CI config) belongs solely to the non-versioned site, but
    # wasn't covered by website/** — it still ran this product build. Ignore
    # that workflow file too.
    paths-ignore: ['website/**', '.github/workflows/website-ci.yml']
  workflow_dispatch:

# Least privilege: this is a read-only test gate; it never writes to the repo.
permissions:
  contents: read

# Only PULL-REQUEST re-pushes dedup (a newer commit on the PR supersedes the stale in-flight
# test run). Keyed by ref for PRs; nothing else triggers this workflow.
concurrency:
  group: linux-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # GitHub-hosted (switched from the self-hosted fleet on 2026-10-04; the
    # self-hosted version is kept in .github/workflows-selfhosted/).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: fedora:44

    steps:
      # GitHub-hosted: the same fedora:44 environment as the self-hosted jarvis-ci
      # image, with infra/ci-image/Dockerfile's package list installed per run
      # (the local registry that served the prebuilt image isn't reachable here).
      - name: Install build deps (infra/ci-image/Dockerfile package set)
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc-c++ cmake ninja-build pkgconf-pkg-config git tar gzip xz \
            curl file findutils which patchelf \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            qt6-qtwebsockets-devel qt6-qtmultimedia-devel qt6-qtsvg-devel \
            qt6-qtwayland qt6-qtwayland-devel layer-shell-qt-devel \
            extra-cmake-modules libsodium-devel qrencode-devel libsecret-devel \
            python3 python3-pip python3-devel python3-pytest \
            desktop-file-utils fuse fuse-libs xcb-util-cursor \
            mesa-libGL-devel mesa-libEGL-devel unzip \
            chromium

      - name: Verify toolchain
        run: |
          cmake --version && ninja --version && qmake6 --version
          test -d /usr/lib64/cmake/Qt6 && echo "Qt6 + toolchain present"

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (ctest, offscreen)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      # chromium (above) lets computer-use/tests/test_browser_vm_chromium.py run the
      # REAL extension against fake VM consoles (it skips when no browser exists).
      - name: Engine pytest (regression gate)
        env:
          CINDRO_TEST_CHROMIUM: /usr/bin/chromium-browser
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./computer-use
          python3 -m pytest computer-use/tests -q
