# Linux regression gate: build the UNTOUCHED root project (core + jarvisd +
# jarvis-sidebar with LayerShellQt), run its ctest suite offscreen, and run the
# computer-use engine's pytest suite. Proves the Windows work left the Linux build green.
#
# Runs in a PREBUILT image (Qt 6.11 + layer-shell-qt 6.7, like the dev box —
# Ubuntu 24.04's apt Qt 6.4.2 is too old). All build deps are baked into the image
# (infra/ci-image/Dockerfile), hosted in the runner's local registry. So a run does
# NO per-build package download AND no per-build install/extract — the container
# starts with everything already present. Rebuild the image only when deps change:
#   infra/ci-image/build.sh   (build -> push to localhost:5000/jarvis-ci:latest)
name: linux-ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Least privilege: this is a read-only test gate; it never writes to the repo.
permissions:
  contents: read

# Superseded dev/PR test runs auto-cancel (a newer push on the same ref wins). A merge to
# main (refs/heads/main) is NOT cancelled — it's the canonical post-merge "is main green"
# gate on the actual merged SHA.
concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    # Prebuilt: all deps baked in. The local registry on the runner host serves it,
    # so the "pull" is instant + layer-cached (no 550MB download, no 533-pkg install).
    container:
      image: localhost:5000/jarvis-ci:latest

    steps:
      # Deps are in the image — just assert the toolchain is present (fails fast +
      # clearly if the image is stale/broken) instead of installing anything.
      - name: Verify toolchain (baked into the image)
        run: |
          cmake --version && ninja --version && qmake6 --version
          test -d /usr/lib64/cmake/Qt6 && echo "Qt6 + toolchain present"

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (ctest, offscreen)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Engine pytest (regression gate)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./computer-use
          python3 -m pytest computer-use/tests -q
