# Linux regression gate: build the UNTOUCHED root project (core + jarvisd +
# jarvis-sidebar with LayerShellQt), run its ctest suite offscreen, and run the
# computer-use engine's pytest suite. Proves the Windows work left the Linux build green.
#
# Runs in a fedora:44 container (Qt 6.11 + layer-shell-qt 6.7, like the dev box —
# Ubuntu 24.04's apt Qt 6.4.2 is too old). The container mounts a PERSISTENT dnf
# cache from the self-hosted runner, so packages download ONCE and are reused every
# build instead of re-pulling ~hundreds of MB each run.
name: linux-ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: fedora:44
      # Persistent package cache on the runner host -> no re-downloads.
      volumes:
        - /var/cache/jarvis-dnf:/var/cache/dnf

    steps:
      # git first (checkout needs it), keepcache=1 keeps the RPMs in the mounted cache.
      - name: Install deps (dnf, cached)
        run: |
          dnf -y --setopt=keepcache=1 --setopt=install_weak_deps=False install \
            gcc-c++ cmake ninja-build pkgconf-pkg-config git tar gzip \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            qt6-qtwebsockets-devel qt6-qtmultimedia-devel qt6-qtsvg-devel \
            qt6-qtwayland qt6-qtwayland-devel layer-shell-qt-devel \
            extra-cmake-modules libsodium-devel qrencode-devel \
            python3 python3-pip python3-devel \
            mesa-libGL-devel mesa-libEGL-devel xcb-util-cursor

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test (ctest, offscreen)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Engine pytest (regression gate)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ./computer-use
          python3 -m pytest computer-use/tests -q
