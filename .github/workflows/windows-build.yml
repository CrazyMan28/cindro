# Builds the REAL Windows artifact: jarvisd.exe + jarvis-sidebar.exe, the bundled
# computer-use engine + Node phone server, packaged into Jarvis-Setup-<ver>.exe.
#
# Everything is driven by the self-contained windows/ build (windows/CMakeLists.txt
# via windows/scripts/build.ps1) — the Linux dirs (core/daemon/desktop) are never
# touched. On a tag (v*) the installer is also attached to the GitHub Release.
name: windows-build

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Needed so the tag build can CREATE the GitHub Release + attach Jarvis-Setup.exe.
permissions:
  contents: write

jobs:
  build:
    # Self-hosted Windows runner (win-runner-1 on the pve/winvm box) — ZERO GitHub
    # minutes. Toolchain provisioned by windows/scripts/setup-runner-tools.ps1
    # (git + vcpkg + Inno Setup; VS Build Tools 2022 already present). Qt / Ninja /
    # Python / Node come from the setup actions below and persist in the runner's
    # tool cache across runs. If the runner is offline the job queues until it's back.
    runs-on: [self-hosted, windows, jarvis-win]

    steps:
      - uses: actions/checkout@v4

      # PowerShell (not bash): the self-hosted Windows runner has no git-bash on
      # PATH for Actions' `shell: bash`, and the Windows/WSL bash stub errors out.
      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = "0.1.0-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # MSVC toolchain (cl + ninja on PATH) for the Ninja generator that build.ps1
      # uses. msvc-dev-cmd finds VS via vswhere and exports the env to later steps.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # Qt 6.11.1 — MATCH the Linux build's Qt (6.11), which is rock solid. On 6.8.1
      # AND 6.9.1, jarvis-sidebar.exe crashed at runtime with an ACCESS VIOLATION
      # deep inside Qt6Qml.dll's JS engine while evaluating a QML binding during
      # scene-graph rendering (WER c0000005; the full crash dump's stack is 100% Qt,
      # zero of our code — confirmed not threading, not GPU, not our C++). So it ran
      # headless with NO window (the sister's bug). It reproduced on a real laptop +
      # a VM. Bumping to the exact Linux Qt line (6.11) is the fix.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets qtmultimedia
          cache: true

      # libsodium + libqrencode via vcpkg. On the self-hosted runner vcpkg lives at
      # C:\vcpkg (VCPKG_INSTALLATION_ROOT, set by setup-runner-tools.ps1) and the
      # packages are prebuilt, so this install is a near-instant cache hit.
      - name: Install vcpkg deps
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          & "$vcpkg\vcpkg.exe" install libsodium libqrencode --triplet x64-windows
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      # Inno Setup 6 (iscc) — packages the staged payload into the installer.
      # Pre-installed on the self-hosted runner by setup-runner-tools.ps1 (no choco);
      # this just puts it on PATH and fails loudly if the runner wasn't provisioned.
      - name: Ensure Inno Setup on PATH
        shell: pwsh
        run: |
          $inno = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) {
            throw "Inno Setup not found on the runner — run windows/scripts/setup-runner-tools.ps1"
          }
          $inno | Out-File -FilePath $env:GITHUB_PATH -Append

      # One-shot: build the daemon + shell, bundle engine + node, make the installer.
      - name: Build Jarvis (Windows)
        shell: pwsh
        run: .\windows\scripts\build.ps1 -Version ${{ steps.ver.outputs.version }} -VcpkgRoot $env:VCPKG_ROOT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup-${{ steps.ver.outputs.version }}
          path: windows/dist/Jarvis-Setup-*.exe
          if-no-files-found: error

      # On a version tag, attach the installer to the Release.
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/Jarvis-Setup-*.exe
