# Builds the REAL Windows artifact: jarvisd.exe + cindro-sidebar.exe, the bundled
# computer-use engine + Node phone server, packaged into Cindro-Setup-<ver>.exe.
#
# Everything is driven by the self-contained windows/ build (windows/CMakeLists.txt
# via windows/scripts/build.ps1) — the Linux dirs (core/daemon/desktop) are never
# touched. On a tag (v*) the installer is also attached to the GitHub Release.
name: windows-build

on:
  # Builds run ONLY for releases and PR validation — NEVER on a branch push. Day-to-day
  # work pushed to dev / qa / main triggers nothing here. A build fires on exactly two
  # events: (1) a v* tag — the release: it builds AND attaches Cindro-Setup.exe to the
  # GitHub Release; (2) a pull_request into main — validates main-bound changes before
  # merge. A merge to main fires auto-release, which creates the v* tag -> case (1) builds
  # and attaches the installer.
  pull_request:
    branches: [main]
    # Codex review (PR #130): a PR that only touches website-ci.yml (the
    # website's own CI config) belongs solely to the non-versioned site, but
    # wasn't covered by website/** — it still ran this product build. Ignore
    # that workflow file too.
    paths-ignore: ['website/**', '.github/workflows/website-ci.yml']
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed so the tag build can CREATE the GitHub Release + attach Cindro-Setup.exe.
permissions:
  contents: write

# Concurrency: a v* tag build (release) is NEVER auto-cancelled — keyed by unique SHA so
# no two tags ever share a group. Only PULL-REQUEST re-pushes dedup: a newer commit on the
# PR supersedes that PR's still-running build (standard, saves runner time).
concurrency:
  group: windows-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # GitHub-hosted runner (switched from the self-hosted win-runner fleet on
    # 2026-10-04; the self-hosted version of this file is kept in
    # .github/workflows-selfhosted/). A hosted VM starts empty, so the toolchain
    # the self-hosted runner had preinstalled (windows/scripts/setup-runner-*.ps1)
    # is provisioned per run below, with actions/cache keeping Qt, vcpkg packages,
    # pip wheels and the frozen engine bundle warm between runs.
    timeout-minutes: 120
    runs-on: windows-latest
    env:
      # build.ps1 keeps its frozen-engine bundle cache + node zip here.
      CINDRO_BUILD_CACHE: C:\cindro-build-cache
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-bincache

    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = "0.1.0-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # MSVC toolchain (cl on PATH) for the Ninja generator build.ps1 uses.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/engine/requirements-windows.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # outpost-agent cross-compile (build.ps1 would otherwise download Go itself).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Same Qt the self-hosted runner pins (6.10.3: fixes the Qt6Qml.dll crash
      # seen on 6.8.1/6.9.1), cached between runs.
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets qtmultimedia
          cache: true

      - name: Point CMake at Qt
        shell: pwsh
        run: |
          "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Command windeployqt | Select-Object -ExpandProperty Source

      # libsodium + libqrencode via the image's vcpkg (C:\vcpkg), with vcpkg's
      # binary cache persisted so they compile only once.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-sodium-qrencode-v1

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          & "$vcpkg\vcpkg.exe" install libsodium libqrencode --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Inno Setup 6 (iscc) packages the installer. Installed via choco when the
      # image doesn't already have it.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $inno = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path "$inno\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          if (-not (Test-Path "$inno\ISCC.exe")) { throw "Inno Setup not found after install" }
          $inno | Out-File -FilePath $env:GITHUB_PATH -Append

      # build.ps1 hashes the engine's sources/requirements into its own cache key
      # and only re-freezes on a miss, so restoring older entries is safe.
      - name: Cache frozen engine bundle + node zip
        uses: actions/cache@v4
        with:
          path: |
            C:\cindro-build-cache
            C:\ci-cache
          key: cindro-engine-${{ runner.os }}-${{ hashFiles('computer-use/**/*.py', 'computer-use/**/*.toml', 'windows/engine/*.py', 'windows/engine/*.txt', 'windows/scripts/build.ps1') }}
          restore-keys: |
            cindro-engine-${{ runner.os }}-

      # One-shot: build the daemon + shell, bundle engine + node, make the installer.
      # PR builds pass -FastCompress (zip installer, exists-only validation, saves
      # minutes of LZMA); tag builds keep lzma2/max for what users actually download.
      - name: Build Cindro (Windows)
        shell: pwsh
        run: .\windows\scripts\build.ps1 -Version ${{ steps.ver.outputs.version }} -VcpkgRoot $env:VCPKG_ROOT -FastCompress:$${{ github.event_name == 'pull_request' }}

      - name: Upload installer artifact
        # Installer is already built above; a transient GitHub artifact-storage
        # quota hit must not red the PR. Short retention stops re-accumulation.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Cindro-Setup-${{ steps.ver.outputs.version }}
          path: windows/dist/Cindro-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

      # On a version tag, attach the installer to the Release.
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/Cindro-Setup-*.exe
