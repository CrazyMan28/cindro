# Builds the Linux release artifact: a portable Jarvis .AppImage (jarvisd +
# jarvis-sidebar + Qt6 + LayerShellQt + the computer-use engine). On a v* tag it is
# attached to the GitHub Release next to the Windows Jarvis-Setup.exe.
#
# Built INSIDE a fedora:44 container — the exact environment the local build
# succeeds in: Qt 6.11, layer-shell-qt 6.7, and a matching libwayland all come from
# one consistent distro package set. The earlier ubuntu-24.04 path fought endless
# version skew (apt Qt 6.4.2 segfaulted qmlcachegen; a binary Qt 6.11 then needed
# ECM 6 + LayerShellQt from source and hit `wl_fixes` because noble's libwayland was
# too old). The distro container sidesteps all of it. Trade-off: the AppImage needs
# a reasonably recent glibc (fedora:44 -> 2.41); older systems use the install script.
name: linux-release

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: fedora:44
      # Persistent package cache on the runner host -> download deps ONCE, reuse.
      # fedora:44 ships dnf5, whose cachedir is /var/cache/libdnf5 (NOT the old
      # dnf4 /var/cache/dnf) — mount the host dir THERE or keepcache caches nothing.
      volumes:
        - /var/cache/jarvis-dnf:/var/cache/libdnf5
    steps:
      # git/tar/gzip are needed by actions/checkout + upload-artifact inside the
      # container; curl/file/findutils by build-appimage.sh + linuxdeploy.
      - name: Install deps (dnf)
        run: |
          dnf -y --setopt=keepcache=1 install \
            gcc-c++ cmake ninja-build pkgconf-pkg-config git tar gzip xz \
            curl file findutils which patchelf \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            qt6-qtwebsockets-devel qt6-qtmultimedia-devel qt6-qtsvg-devel \
            qt6-qtwayland qt6-qtwayland-devel layer-shell-qt-devel \
            libsodium-devel qrencode-devel \
            python3 python3-pip python3-devel \
            desktop-file-utils fuse fuse-libs xcb-util-cursor \
            mesa-libGL-devel mesa-libEGL-devel

      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the AppImage
        run: packaging/build-appimage.sh "${{ steps.ver.outputs.version }}"

      # Gate: the AppImage MUST load the full UI (offscreen) or we don't ship it.
      # Catches the "bundled libs segfault" class of failures before release.
      - name: Smoke-test the AppImage (offscreen --selftest)
        run: |
          chmod +x dist/Jarvis-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./dist/Jarvis-*.AppImage --selftest
          echo "AppImage selftest OK"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ steps.ver.outputs.version }}-AppImage
          path: dist/Jarvis-*.AppImage
          if-no-files-found: error

      - name: Attach to Release (on a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Jarvis-*.AppImage
