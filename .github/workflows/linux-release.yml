# Builds the Linux release artifact: a portable Jarvis .AppImage (jarvisd +
# jarvis-sidebar + Qt6 + LayerShellQt + the computer-use engine). On a v* tag it is
# attached to the GitHub Release next to the Windows Jarvis-Setup.exe.
#
# Built INSIDE a PREBUILT image (Qt 6.11, layer-shell-qt 6.7, matching libwayland —
# the exact environment the local build succeeds in). All deps are baked into the
# image (infra/ci-image/Dockerfile, served from the runner's local registry), so a
# run does NO per-build package download or install. The earlier ubuntu-24.04 path
# fought endless version skew (apt Qt 6.4.2 segfaulted qmlcachegen); the distro image
# sidesteps it. Trade-off: the AppImage needs a recent glibc (fedora:44 -> 2.41);
# older systems use the install script. Rebuild the image when deps change:
#   infra/ci-image/build.sh
name: linux-release

on:
  # 'main' is intentionally NOT in push.branches (mirrors windows-build.yml): a merge to
  # main fires auto-release -> tags the version -> that tag (below) builds AND attaches
  # the AppImage to the Release. A push:main build here would be a redundant second build
  # that never attaches. Pre-merge Linux validation is linux-ci.yml (push+PR); this
  # workflow only needs dev (packaging sanity) + tags (the actual release artifact).
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: [self-hosted, Linux, X64]
    # Prebuilt: all deps (incl. curl/file/findutils/patchelf/fuse for linuxdeploy)
    # baked into the image and served from the runner's local registry — instant pull,
    # no 550MB download, no per-build install.
    container:
      image: localhost:5000/jarvis-ci:latest
    steps:
      # Deps are in the image — assert the toolchain + AppImage tooling are present.
      - name: Verify toolchain (baked into the image)
        run: |
          cmake --version && ninja --version && qmake6 --version
          command -v patchelf file curl && test -d /usr/lib64/cmake/Qt6
          echo "toolchain + AppImage tooling present"

      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the AppImage
        run: packaging/build-appimage.sh "${{ steps.ver.outputs.version }}"

      # Gate: the AppImage MUST load the full UI (offscreen) or we don't ship it.
      # Catches the "bundled libs segfault" class of failures before release.
      - name: Smoke-test the AppImage (offscreen --selftest)
        run: |
          chmod +x dist/Jarvis-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./dist/Jarvis-*.AppImage --selftest
          echo "AppImage selftest OK"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ steps.ver.outputs.version }}-AppImage
          path: dist/Jarvis-*.AppImage
          if-no-files-found: error

      - name: Attach to Release (on a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Jarvis-*.AppImage
