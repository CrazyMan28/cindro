# Builds the Linux release artifact: a portable Jarvis .AppImage (jarvisd +
# jarvis-sidebar + Qt6 + LayerShellQt + the computer-use engine). On a v* tag it is
# attached to the GitHub Release next to the Windows Jarvis-Setup.exe.
name: linux-release

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # The app REQUIRES Qt >= 6.5 (desktop/CMakeLists.txt: qt_standard_project_setup
      # REQUIRES 6.5; the UI imports QtQuick.Effects/MultiEffect). Ubuntu 24.04 apt
      # ships Qt 6.4.2, on which qmlcachegen SEGFAULTS (CI exit 139). Install a real
      # Qt 6.8 instead and build everything against it.
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          # Match the Fedora dev box (6.11.1): satisfies LayerShellQt master's
          # Qt >= 6.10 floor and is the exact version the app/QML was built on.
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # qtwayland is NOT a separate aqt module on 6.8 — it ships in the base
          # linux desktop install (provides Qt6WaylandClient for LayerShellQt).
          modules: 'qtwebsockets qtmultimedia qtimageformats'
          cache: true

      - name: Install non-Qt build deps + ECM 6 + LayerShellQt (built against Qt 6.8)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsodium-dev libqrencode-dev python3 python3-venv python3-pip \
            libfuse2 libxcb-cursor0 desktop-file-utils \
            libwayland-dev libwayland-bin wayland-protocols \
            libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev
          # noble's apt extra-cmake-modules is 5.115, but LayerShellQt 6 needs ECM
          # >= 6.26 (Fedora dev box has 6.27). Build ECM from source (cmake-only,
          # seconds) into the Qt prefix so find_package(ECM) resolves the new one.
          git clone --depth 1 https://invent.kde.org/frameworks/extra-cmake-modules.git /tmp/ecm
          cmake -S /tmp/ecm -B /tmp/ecm/b -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR" -DBUILD_TESTING=OFF
          cmake --build /tmp/ecm/b
          cmake --install /tmp/ecm/b
          # jarvis-sidebar links LayerShellQt 6.x. The apt package links Qt 6.4.2
          # (ABI-incompatible with our Qt 6.8), so build from source against the aqt
          # Qt + the ECM6 above; install into the same prefix for find_package.
          git clone --depth 1 https://invent.kde.org/plasma/layer-shell-qt.git /tmp/lsq
          cmake -S /tmp/lsq -B /tmp/lsq/b -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR" \
            -DBUILD_TESTING=OFF -DQT_MAJOR_VERSION=6
          cmake --build /tmp/lsq/b
          cmake --install /tmp/lsq/b

      - name: Build the AppImage
        run: packaging/build-appimage.sh "${{ steps.ver.outputs.version }}"

      # Gate: the AppImage MUST load the full UI (offscreen) or we don't ship it.
      # Catches the "bundled libs segfault" class of failures before release.
      - name: Smoke-test the AppImage (offscreen --selftest)
        run: |
          chmod +x dist/Jarvis-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./dist/Jarvis-*.AppImage --selftest
          echo "AppImage selftest OK"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-${{ steps.ver.outputs.version }}-AppImage
          path: dist/Jarvis-*.AppImage
          if-no-files-found: error

      - name: Attach to Release (on a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Jarvis-*.AppImage
