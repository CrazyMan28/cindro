# Builds the Linux release artifact: a portable Jarvis .AppImage (jarvisd +
# cindro-sidebar + Qt6 + LayerShellQt + the computer-use engine). On a v* tag it is
# attached to the GitHub Release next to the Windows Cindro-Setup.exe.
#
# Built INSIDE a PREBUILT image (Qt 6.11, layer-shell-qt 6.7, matching libwayland —
# the exact environment the local build succeeds in). All deps are baked into the
# image (infra/ci-image/Dockerfile, served from the runner's local registry), so a
# run does NO per-build package download or install. The earlier ubuntu-24.04 path
# fought endless version skew (apt Qt 6.4.2 segfaulted qmlcachegen); the distro image
# sidesteps it. Trade-off: the AppImage needs a recent glibc (fedora:44 -> 2.41);
# older systems use the install script. Rebuild the image when deps change:
#   infra/ci-image/build.sh
name: linux-release

on:
  # Builds run ONLY for releases and PR validation — never on a branch push. A v* tag (the
  # release) builds the AppImage AND attaches it to the GitHub Release; a pull_request into
  # main validates AppImage packaging before merge. A merge to main fires auto-release,
  # which creates the v* tag -> that tag build attaches the artifact.
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A v* tag build (release) is NEVER auto-cancelled. Only PULL-REQUEST re-pushes dedup (a
# newer commit on the PR supersedes the stale in-flight packaging build).
concurrency:
  group: linux-release-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appimage:
    runs-on: [self-hosted, Linux, X64]
    # 90 min (1h30) — gives slack when the Proxmox runner host is IO/CPU-starved and slow.
    timeout-minutes: 90
    # Prebuilt: all deps (incl. curl/file/findutils/patchelf/fuse for linuxdeploy)
    # baked into the image and served from the runner's local registry — instant pull,
    # no 550MB download, no per-build install.
    container:
      image: localhost:5000/jarvis-ci:latest
    steps:
      # Deps are in the image — assert the toolchain + AppImage tooling are present.
      - name: Verify toolchain (baked into the image)
        run: |
          cmake --version && ninja --version && qmake6 --version
          command -v patchelf file curl && test -d /usr/lib64/cmake/Qt6
          echo "toolchain + AppImage tooling present"

      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # The outpost-agent binaries (outpost-mcp/agent-bin/) are gitignored and
      # were never shipped, so a fresh outpost hub 404'd every pairing. Cross-
      # compile all 6 targets here — BEFORE the AppImage step, which bundles
      # whatever's in agent-bin/ into the AppImage itself (packaging/build-
      # appimage.sh step 3b) — and also attach them to the Release so a binary
      # install (no Go toolchain) still gets them.
      - name: Build outpost-agent binaries
        run: |
          if command -v go >/dev/null 2>&1; then
            # No `|| true`: a real cross-compile failure MUST red the job, else a
            # tagged Release silently ships without the agent binaries and every
            # fresh-hub pairing 404s again — the exact bug this step prevents.
            (cd outpost-agent && ./build.sh)
            ls -la outpost-mcp/agent-bin/
          else
            echo "go toolchain absent on the runner; skipping outpost-agent build"
          fi

      - name: Build the AppImage
        run: packaging/build-appimage.sh "${{ steps.ver.outputs.version }}"

      # Gate: the AppImage MUST load the full UI (offscreen) or we don't ship it.
      # Catches the "bundled libs segfault" class of failures before release.
      - name: Smoke-test the AppImage (offscreen --selftest)
        run: |
          chmod +x dist/Cindro-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen ./dist/Cindro-*.AppImage --selftest
          echo "AppImage selftest OK"

      - name: Upload AppImage artifact
        # The AppImage is already built + selftested above; a transient GitHub
        # artifact-storage-quota hit must not red the whole PR. Short retention
        # keeps the quota from re-accumulating (dev builds are throwaway).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Cindro-${{ steps.ver.outputs.version }}-AppImage
          path: dist/Cindro-*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Attach to Release (on a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The AppImage plus the outpost-agent binaries (if the runner built
          # them). fail_on_unmatched_files stays off so a Go-less runner still
          # ships the AppImage rather than reddening the release.
          fail_on_unmatched_files: false
          files: |
            dist/Cindro-*.AppImage
            outpost-mcp/agent-bin/outpost-agent-*
