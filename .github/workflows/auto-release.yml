# Auto-release on merge to main (bump-gated).
#
# Flow: a PR merges to main -> this reads JARVIS_VERSION from windows/CMakeLists.txt.
#   * If v<version> is NOT already tagged -> it creates + pushes that tag, which fires
#     windows-build + linux-release (their `on: push: tags: v*`) to build and ATTACH the
#     Jarvis-Setup.exe + AppImage to a new GitHub Release v<version>.
#   * If the version wasn't bumped (tag already exists) -> it does nothing. So a doc/CI
#     PR never publishes a release; only a PR that bumps JARVIS_VERSION does.
#
# Why a PAT (secret RELEASE_PAT) and not the default GITHUB_TOKEN:
#   GitHub deliberately will NOT let a tag pushed by GITHUB_TOKEN trigger other workflows
#   (anti-recursion). So the tag must be pushed by a real token. One-time setup:
#     1. Create a token with Contents: write on this repo
#        (fine-grained PAT -> repo=jarvis, Contents: Read and write; or a classic PAT with `repo`).
#     2. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#        -> name: RELEASE_PAT, value: <the token>.
#   Until it's set, this job no-ops with a warning (it will not tag, so nothing publishes).
#
# Runs on the self-hosted Linux runner (no GitHub-hosted minutes).
name: auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check RELEASE_PAT is configured
        id: gate
        env:
          PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::RELEASE_PAT secret not set -> skipping auto-release. Add it so a pushed tag can trigger the release builds (see this file's header)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (auth as RELEASE_PAT so the tag push triggers the release builds)
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag v<JARVIS_VERSION> if it is new
        if: steps.gate.outputs.ok == 'true'
        run: |
          set -e
          VER=$(grep -oP 'set\(JARVIS_VERSION\s+"\K[0-9]+\.[0-9]+\.[0-9]+' windows/CMakeLists.txt | head -1)
          if [ -z "$VER" ]; then echo "::error::could not read JARVIS_VERSION from windows/CMakeLists.txt"; exit 1; fi
          echo "JARVIS_VERSION = $VER"
          if git ls-remote --tags origin "refs/tags/v$VER" | grep -q .; then
            echo "v$VER already released -> nothing to do (bump JARVIS_VERSION in a PR to publish)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VER" -m "Release v$VER"
          git push origin "v$VER"
          echo "Tagged + pushed v$VER -> windows-build + linux-release will build and publish Release v$VER."
