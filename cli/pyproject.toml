[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-cli"
version = "0.1.0"
description = "The Jarvis terminal: doctor/status/service commands + a full-screen TUI coding agent over the jarvisd Contract A control WS (Linux + Windows)."
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "rich>=13.0",
    "textual>=0.58",
]

[project.scripts]
jarvis = "jarvis_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_cli"]
